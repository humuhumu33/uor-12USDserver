name: plant
on:
  push:
    branches: ['server/users-held']
    paths: ['emit/plant.sh', 'emit/sdk-emit.sh', 'crates/conformance/tests/core.rs', '.github/workflows/plant.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plant:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only meaningful on a commit whose module is fresh: on a stale one every defect fails for staleness alone.
      - name: Plant each defect and confirm a gate rejects it
        shell: bash
        run: |
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,size=8g \
            --volume "$PWD:$PWD" --workdir "$PWD" --env HOME=/tmp/home "$image" \
            bash -c 'mkdir -p "$HOME"; bash emit/plant.sh' 2>&1 | cut -c1-500
