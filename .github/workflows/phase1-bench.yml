name: phase1-bench
on:
  push:
    branches: ['feasibility/phase-1']
    paths: ['feasibility/bench/**', 'feasibility/generated/**', 'feasibility/sdk-bench.sh', '.github/workflows/phase1-bench.yml']
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Benchmark on one CPU in the locked SDK
        shell: bash
        run: |
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          docker run --rm --cpuset-cpus=1 --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,size=4g \
            --volume "$PWD:$PWD" --workdir "$PWD" --env HOME=/tmp/home "$image" \
            bash -c 'mkdir -p "$HOME"; bash feasibility/sdk-bench.sh'
  constrained:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {root: stepCode, pkg: kern_step, target: rust-core, limit: '--memory=2g --memory-swap=2g --cpus=1'}
          - {root: routeWords, pkg: kern_route_words, target: rust-core, limit: '--memory=2g --memory-swap=2g --cpus=1'}
          - {root: zeroRoot, pkg: kern_zero, target: rust-core, limit: ''}
          - {root: escapeByte, pkg: kern_escape_byte, target: rust-core, limit: '--memory=2g --memory-swap=2g --cpus=1'}
          - {root: shaRound, pkg: kern_sha_round, target: rust-core, limit: '--memory=2g --memory-swap=2g --cpus=1'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export ${{ matrix.root }} ${{ matrix.limit }}
        shell: bash
        run: |
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          mkdir -p feasibility/out
          chmod -R a+rwX feasibility
          docker run --rm ${{ matrix.limit }} --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,size=1g \
            --volume "$PWD:$PWD" --workdir "$PWD" --env HOME=/tmp/home "$image" \
            bash -c 'mkdir -p "$HOME"; bash feasibility/sdk-stage1.sh "$@"' _ \
            "${{ matrix.root }}" "${{ matrix.pkg }}" "${{ matrix.target }}" 2>&1 | tee feasibility/out/stage1.log
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {size: 16384, limit: '--memory=2g --memory-swap=2g --cpus=1'}
          - {size: 65536, limit: '--memory=2g --memory-swap=2g --cpus=1'}
          - {size: 131072, limit: ''}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Generator with ${{ matrix.size }} bytes of source ${{ matrix.limit }}
        shell: bash
        run: |
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          sed -i 's/max_file_bytes = 4194304/max_file_bytes = 67108864/; s/max_child_output_bytes = 16777216/max_child_output_bytes = 134217728/' feasibility/kernels/lexlean.toml
          mkdir -p feasibility/out
          chmod -R a+rwX feasibility
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,size=4g \
            --volume "$PWD:$PWD" --workdir "$PWD" --env HOME=/tmp/home "$image" \
            bash -c 'mkdir -p "$HOME"; bash feasibility/sdk-generator.sh "$@"' _ 131072 1024
