name: phase1-generator
on:
  push:
    branches: ['feasibility/phase-1']
    paths: ['feasibility/gen_generator.py', 'feasibility/sdk-generator.sh', '.github/workflows/phase1-generator.yml']
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {size: 4096, chunk: 1024}
          - {size: 16384, chunk: 16384}
          - {size: 16384, chunk: 1024}
          - {size: 65536, chunk: 1024}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Generator ${{ matrix.size }} in ${{ matrix.chunk }} byte literals
        shell: bash
        run: |
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          mkdir -p feasibility/out
          chmod -R a+rwX feasibility
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,size=4g \
            --volume "$PWD:$PWD" --workdir "$PWD" --env HOME=/tmp/home "$image" \
            bash -c 'mkdir -p "$HOME"; bash feasibility/sdk-generator.sh "$@"' _ \
            "${{ matrix.size }}" "${{ matrix.chunk }}" 2>&1 | tee feasibility/out/generator.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: generator-${{ matrix.size }}-${{ matrix.chunk }}
          path: feasibility/out
