name: load-rig
on:
  push:
    branches: ['server/users-held']
    paths: ['rig/**', 'server/**', '.github/workflows/rig.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  CHALLENGE_COMMIT: c7764b60
jobs:
  measure:
    # One job, so every server shares a machine. Runners differ between jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the machine
        shell: bash
        run: |
          uname -r
          grep -m1 'model name' /proc/cpuinfo
          nproc
          free -m | head -2
          sudo apt-get update -qq
          sudo apt-get install -y -qq liburing-dev sqlite3 jq gdb build-essential linux-tools-common "linux-tools-$(uname -r)" > /dev/null || sudo apt-get install -y -qq liburing-dev sqlite3 jq gdb build-essential > /dev/null
          sudo sysctl -q -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          sudo sysctl -q -w kernel.core_pattern=/tmp/core.%e.%p fs.suid_dumpable=2
          sudo sysctl -q -w fs.nr_open=2097152 net.ipv4.ip_local_port_range="1024 65000"
          # The box has no conntrack table, and this runner's Docker rules would add one.
          sudo iptables -t raw -A PREROUTING -i lo -j NOTRACK
          sudo iptables -t raw -A OUTPUT -o lo -j NOTRACK
      - name: Build the rig and the seed
        shell: bash
        run: |
          gcc -O2 -o rig/loadgen rig/loadgen.c -lm
          gcc -O2 -o rig/floor rig/floor.c -luring
          git clone -q https://github.com/arjaythedev/twelve-dollar-server-challenge.git "$RUNNER_TEMP/challenge"
          cd "$RUNNER_TEMP/challenge"
          git checkout -q "$CHALLENGE_COMMIT"
          bash seed/make-seed.sh > /dev/null 2>&1
          ls -la seed/feed.db
          jq -r '.[].token' seed/tokens.json > tokens.txt
          wc -l tokens.txt
      - name: Build our server
        timeout-minutes: 10
        shell: bash
        run: |
          sudo bash server/install.sh
          bash server/build.sh 2>&1 | grep -v 'sqlite3.c' | tail -30
          ls -la server/bin/server
      - name: The 42 tests
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/challenge/submissions/ours-under-test"
          cp -r server/. "$RUNNER_TEMP/challenge/submissions/ours-under-test/"
          cd "$RUNNER_TEMP/challenge"
          bash test/run.sh submissions/ours-under-test 2>&1 | tail -40
      - name: Build both read paths, logging every second
        timeout-minutes: 15
        shell: bash
        run: |
          # The commit before the multishot receive, so the two differ only in how requests are read.
          git worktree add -q /tmp/poll e3e97f72051fe443ac3cdea9f743b23906f0c15d
          mkdir -p /tmp/variants
          cp -r /tmp/poll/server /tmp/variants/v-poll
          cp -r server /tmp/variants/v-multishot
          sed -i 's/define CHECKPOINT_NICE 10/define CHECKPOINT_NICE 19/; s/cache_size = -8192/cache_size = -32768/' /tmp/variants/v-poll/src/server.c
          grep -q 'define CHECKPOINT_NICE 19' /tmp/variants/v-poll/src/server.c
          grep -q 'cache_size = -32768' /tmp/variants/v-poll/src/server.c
          for v in v-poll v-multishot; do
            sed -i 's/next_stats = now_seconds + 10;/next_stats = now_seconds + 1;/' "/tmp/variants/$v/src/server.c"
            grep -q 'next_stats = now_seconds + 1;' "/tmp/variants/$v/src/server.c"
            bash "/tmp/variants/$v/build.sh" 2>&1 | tail -1
          done
      - name: Build the control
        shell: bash
        run: |
          cd "$RUNNER_TEMP/challenge/submissions/c-iouring-pavlyhalim"
          sudo bash install.sh > /dev/null 2>&1
          bash build.sh 2>&1 | tail -3
      - name: Measure
        shell: bash
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          # Runners differ by CPU model: compare only within one job, and read this line before comparing across jobs.
          echo "RUNNER $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2) kernel=$(uname -r)"
          # Near the limit, interleaved so drift on this machine hits both servers.
          # 73%: the quota at which the control spends the same share here at 295k as on the box (59% against 81%).
          # Saturation is where servers died, and runners differ. So measure what this CPU needs uncapped, then cap just under it.
          users=320000
          echo "=== calibrate v-multishot at $users users, no cap"
          bash rig/measure.sh v-multishot "$users" 90 150 "$RUNNER_TEMP/challenge" "$PWD/rig" | tee /tmp/calibrate.txt | grep -E 'RESULT|LOAD |SERVER DIED'
          needed=$(sed -nE 's/.*cpu_pct=([0-9]+).*/\1/p' /tmp/calibrate.txt | tail -1)
          [ -n "$needed" ] || { echo "no calibration"; exit 1; }
          # Five points under what it used uncapped, so it saturates. A rival process instead of a quota: see measure.sh.
          export CPU_SHARE="$((needed - 5))"
          echo "CALIBRATED needed=$needed share=$CPU_SHARE"
          for run in "v-multishot 320000" "control 320000" "v-multishot 340000" "control 340000" "v-multishot 320000" "control 320000" "v-multishot 340000" "control 340000"; do
            read -r server users <<< "$run"
            echo "=== $server at $users users"
            bash rig/measure.sh "$server" "$users" 90 150 "$RUNNER_TEMP/challenge" "$PWD/rig"
            sleep 3
          done
