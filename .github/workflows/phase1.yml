name: phase1-feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {root: stepCode, pkg: kern_step, target: rust-core}
          - {root: routeWords, pkg: kern_route_words, target: rust-core}
          - {root: needsEscape, pkg: kern_escape, target: rust-core}
          - {root: shaRound, pkg: kern_sha_round, target: rust-core}
          - {root: routeBytes, pkg: kern_route_bytes, target: rust-std}
          - {root: postJson, pkg: kern_post_json, target: rust-std}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export ${{ matrix.root }} in the locked SDK
        shell: bash
        run: |
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          mkdir -p feasibility/out
          chmod -R a+rwX feasibility
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" --workdir "$PWD" --env HOME=/tmp/home "$image" \
            bash -c 'mkdir -p "$HOME"; bash feasibility/sdk-stage1.sh "$@"' _ \
            "${{ matrix.root }}" "${{ matrix.pkg }}" "${{ matrix.target }}" 2>&1 | tee feasibility/out/stage1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase1-${{ matrix.root }}
          path: feasibility/out
