# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The first row is the template's own Prism application in `app/` (TC-01).
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "TC-01"
level = "build"
suite = "contract"
statement = "The checker answers conformant exactly when every universal policy file's observed digest equals its locked digest"

[[id]]
id = "SV-01"
level = "build"
suite = "core"
statement = "A response leaves only after its batch commits, and a failure response only after the commit fails"

[[id]]
id = "SV-02"
level = "build"
suite = "core"
statement = "Only POST writes, every write needs a token, and an unknown method is not found"

[[id]]
id = "SV-03"
level = "build"
suite = "core"
statement = "Reads go on while writes wait, and a held connection keeps its order while the hold queue has room"

[[id]]
id = "SV-04"
level = "build"
suite = "core"
statement = "The write pause closes at its limit and opens when the log is copied or the wait times out"

[[id]]
id = "SV-05"
level = "build"
suite = "core"
statement = "Only an internal failure is a server error"

[[id]]
id = "SV-06"
level = "build"
suite = "core"
statement = "A quote, a backslash and the control bytes are escaped at the checked values, and the emitted table matches the rule for all 256 bytes"

[[id]]
id = "SV-07"
level = "build"
suite = "core"
statement = "Every file in server is what the certified root writes, and the committed module is not stale"

[[id]]
id = "SV-08"
level = "build"
suite = "core"
statement = "The box's build checks the theorems and writes the C with official Lean alone, and stops on a false theorem, a sorry or an edited file"
